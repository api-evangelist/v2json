aid: v2json

name: V2JSON (SkyV2X)

image: https://v2json.skyv2x.com/v2json-asn1-to-json-decoder-v3.jpg

description: V2JSON (SkyV2X) provides a free online V2X message codec that converts ETSI C‑ITS UPER binary streams to structured JSON and back.
  It supports a wide range of message types including CAM, DENM, CPM, VAM, MAPEM, SPATEM, SREM, SSEM, IVIM and RTCMEM, offering byte‑exact round‑trip
  verification. The service is publicly accessible via a REST API with endpoints for decode, encode, and verify, and requires no API key. Documentation
  is available through a Swagger UI at /docs, and the company also offers an interactive web‑based codec interface.

